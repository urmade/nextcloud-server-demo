[workspace]
resolver = "3"
members = ["crates/nc-gateway"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "AGPL-3.0-or-later"
repository = "https://github.com/urmade/nextcloud-server-demo"
publish = false

[workspace.dependencies]
arc-swap = "1.9"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
bytes = "1.12"
clap = { version = "4.6", features = ["derive", "env"] }
fastrand = "2.5"
http = "1.5"
http-body-util = "0.1"
hyper = { version = "1.12", features = ["http1", "client", "server"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "server-graceful", "tokio"] }
ipnet = "2.12"
prometheus = { version = "0.14", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.27"
thiserror = "2.0"
tokio = { version = "1.54", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
toml = "1.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.29", features = ["v4"] }
wiremock = "0.6"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
