name: Integration through gateway

# Runs black-box suites twice, against PHP directly (the control) and through
# the Rust gateway in front of PHP. A suite that passes direct but fails through
# the gateway means the gateway is not transparent.

on:
  pull_request:
    paths:
      - 'rust/**'
      - 'build/integration/run.sh'
      - '.github/workflows/integration-gateway.yml'
  push:
    branches:
      - master
    paths:
      - 'rust/**'
      - 'build/integration/run.sh'
      - '.github/workflows/integration-gateway.yml'

permissions:
  contents: read

concurrency:
  group: integration-gateway-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  PHP_VERSION: '8.3'
  PHP_EXTENSIONS: bz2, ctype, curl, dom, fileinfo, gd, iconv, intl, json, libxml, mbstring, openssl, pcntl, posix, redis, session, simplexml, xmlreader, xmlwriter, zip, zlib, sqlite, pdo_sqlite

jobs:
  build-gateway:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: rust

      - name: Build the gateway
        working-directory: rust
        run: cargo build --release --locked -p nc-gateway

      - name: Upload the gateway binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nc-gateway
          path: rust/target/release/nc-gateway
          if-no-files-found: error
          retention-days: 1

  behat:
    runs-on: ubuntu-latest
    needs: build-gateway
    name: Behat ${{ matrix.test-suite }} (${{ matrix.target }})

    strategy:
      fail-fast: false
      matrix:
        target: ['direct', 'gateway', 'gateway-all-rust']
        test-suite:
          - 'capabilities_features'
          - 'collaboration_features'
          - 'comments_features'
          - '--tags ~@requires-s3 dav_features'
          - '--tags ~@large files_features'
          - 'routing_features'
          - 'sharees_features'
          - 'theming_features'

    steps:
      - name: Checkout server
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 #v2.37.2
        timeout-minutes: 5
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
          ini-file: development
          ini-values: disable_functions=""
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up dependencies
        run: composer install

      - name: Set up Nextcloud
        run: |
          mkdir data
          ./occ maintenance:install --verbose --database=sqlite --database-name=nextcloud --database-user=root --database-pass=rootpassword --admin-user admin --admin-pass admin
          ./occ config:system:set hashing_default_password --value=true --type=boolean

      - name: Let PHP trust the gateway as a reverse proxy
        if: ${{ matrix.target != 'direct' }}
        run: |
          ./occ config:system:set trusted_proxies 0 --value=127.0.0.1
          ./occ config:system:set trusted_proxies 1 --value='::1'

      - name: Download the gateway
        if: ${{ matrix.target != 'direct' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nc-gateway
          path: rust/target/release

      - name: Run the suite directly against PHP
        if: ${{ matrix.target == 'direct' }}
        working-directory: build/integration
        run: bash run.sh ${{ matrix.test-suite }} no-tail-log

      - name: Run the suite through the gateway
        if: ${{ matrix.target != 'direct' }}
        working-directory: build/integration
        env:
          PHP_SERVER_PORT: '8081'
          NC_GATEWAY_ROUTE_TABLE: ${{ github.workspace }}/rust/ci/routes/${{ matrix.target == 'gateway' && 'pass-through' || 'all-rust-falls-back' }}.toml
        run: |
          chmod +x ../../rust/target/release/nc-gateway
          ../../rust/ci/with-gateway.sh bash run.sh ${{ matrix.test-suite }} no-tail-log

      - name: Print logs
        if: always()
        run: cat "$(./occ log:file | grep 'Log file' | cut -d' ' -f3)"

  litmus:
    runs-on: ubuntu-latest
    needs: build-gateway
    name: Litmus ${{ matrix.endpoint }} (${{ matrix.target }})

    strategy:
      fail-fast: false
      matrix:
        target: ['direct', 'gateway']
        endpoint: ['webdav', 'dav']

    steps:
      - name: Checkout server
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 #v2.37.2
        timeout-minutes: 5
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
          ini-file: development
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Nextcloud
        run: |
          mkdir data
          ./occ maintenance:install \
            --verbose \
            --database=sqlite \
            --database-name=nextcloud \
            --database-user=root \
            --database-pass=rootpassword \
            --admin-user admin \
            --admin-pass admin
          ./occ config:system:set trusted_domains 2 --value=host.docker.internal:8080
          ./occ config:system:set trusted_proxies 0 --value=127.0.0.1
          ./occ config:system:set trusted_proxies 1 --value='::1'

      - name: Download the gateway
        if: ${{ matrix.target == 'gateway' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nc-gateway
          path: rust/target/release

      - name: Run Nextcloud directly
        if: ${{ matrix.target == 'direct' }}
        run: php -S 0.0.0.0:8080 &

      - name: Run Nextcloud behind the gateway
        if: ${{ matrix.target == 'gateway' }}
        run: |
          chmod +x rust/target/release/nc-gateway
          php -S 127.0.0.1:8081 &
          rust/target/release/nc-gateway \
              --listen 0.0.0.0:8080 \
              --upstream http://127.0.0.1:8081 \
              --route-table rust/ci/routes/pass-through.toml \
              > gateway.log 2>&1 &
          for _ in $(seq 1 50); do
            curl --silent --fail http://127.0.0.1:9100/healthz && break
            sleep 0.2
          done

      - name: Run Litmus test
        run: |
          docker run \
          --rm \
          --add-host=host.docker.internal:host-gateway \
          ghcr.io/nextcloud/continuous-integration-litmus-php8.3:latest \
          bash -c '\
            cd /tmp/litmus/litmus-0.13;
            make URL=http://host.docker.internal:8080/remote.php/${{ matrix.endpoint }}${{ matrix.endpoint == 'dav' && '/files/admin' || ''}} CREDS="admin admin" TESTS="basic copymove props largefile" check;
            status=$?;
            cat debug.log;
            exit $status;'

      - name: The gateway proxied the Litmus traffic
        if: ${{ matrix.target == 'gateway' }}
        run: |
          proxied="$(curl --silent http://127.0.0.1:9100/metrics | awk '/^nc_gateway_requests_total/ { sum += $NF } END { print sum + 0 }')"
          echo "proxied requests: $proxied"
          test "$proxied" -gt 0

      - name: Print logs
        if: always()
        run: |
          cat data/nextcloud.log
          cat gateway.log 2>/dev/null || true

  smoke:
    runs-on: ubuntu-latest
    needs: build-gateway
    name: Playwright smoke (${{ matrix.target }})

    strategy:
      fail-fast: false
      matrix:
        target: ['direct', 'gateway']

    steps:
      - name: Checkout server
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true

      - name: Read package.json
        uses: nextcloud-libraries/parse-package-engines-action@122ae05d4257008180a514e1ddeb0c1b9d094bdd # v0.1.0
        id: versions

      - name: Set up node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.versions.outputs.node-version }}

      - name: Install Playwright
        run: npm ci --ignore-scripts

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 #v2.37.2
        timeout-minutes: 5
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
          ini-file: development
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Nextcloud
        run: |
          composer install
          mkdir data
          ./occ maintenance:install --verbose --database=sqlite --database-name=nextcloud --database-user=root --database-pass=rootpassword --admin-user admin --admin-pass admin
          ./occ config:system:set auth.bruteforce.protection.enabled --value false --type bool
          ./occ config:system:set ratelimit.protection.enabled --value false --type bool
          ./occ config:system:set trusted_proxies 0 --value=127.0.0.1
          ./occ config:system:set trusted_proxies 1 --value='::1'

      - name: Download the gateway
        if: ${{ matrix.target == 'gateway' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nc-gateway
          path: rust/target/release

      - name: Run the smoke tests directly against PHP
        if: ${{ matrix.target == 'direct' }}
        env:
          NC_TEST_BASE_URL: http://localhost:8080
          PHP_CLI_SERVER_WORKERS: '4'
        run: |
          php -S localhost:8080 &
          sleep 2
          npx playwright test --config rust/tests/smoke/playwright.config.ts

      - name: Run the smoke tests through the gateway
        if: ${{ matrix.target == 'gateway' }}
        env:
          NC_TEST_BASE_URL: http://localhost:8080
          NC_GATEWAY_ROUTE_TABLE: ${{ github.workspace }}/rust/ci/routes/pass-through.toml
          PHP_CLI_SERVER_WORKERS: '4'
        run: |
          chmod +x rust/target/release/nc-gateway
          php -S localhost:8081 &
          sleep 2
          rust/ci/with-gateway.sh npx playwright test --config rust/tests/smoke/playwright.config.ts

      - name: Print logs
        if: always()
        run: cat data/nextcloud.log

  summary:
    permissions:
      contents: none
    runs-on: ubuntu-latest
    needs: [build-gateway, behat, litmus, smoke]
    if: always()
    name: integration-gateway-summary
    steps:
      - name: Summary status
        run: if ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}; then exit 1; fi
